apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dbguard
  namespace: dbguard
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [dbguard.example.com]
      secretName: dbguard-tls
  rules:
    - host: dbguard.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dbguard
                port:
                  name: http
