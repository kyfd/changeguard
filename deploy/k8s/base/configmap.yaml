apiVersion: v1
kind: ConfigMap
metadata:
  name: changeguard-config
  namespace: dbguard
data:
  PORT: "8080"
  CHANGEGUARD_STORE_MODE: postgres
  CHANGEGUARD_SESSION_MODE: redis
  CHANGEGUARD_WORKERS: "4"
  CHANGEGUARD_DB_MAX_CONNS: "30"
  CHANGEGUARD_DB_MIN_CONNS: "4"
  CHANGEGUARD_AUTH_MODE: hybrid
  CHANGEGUARD_AUTH_SESSION_TTL: 12h
  CHANGEGUARD_AUTH_SECURE_COOKIE: "true"
  CHANGEGUARD_OIDC_REQUIRE_VERIFIED_EMAIL: "true"
  CHANGEGUARD_TRUST_PROXY_HEADERS: "true"
  CHANGEGUARD_EXPERIMENT_MODE: postgres
  CHANGEGUARD_LLM_LIMIT_MODE: redis
  CHANGEGUARD_LLM_DAILY_ANALYSIS_LIMIT: "20"
  CHANGEGUARD_LLM_DAILY_ORG_LIMIT: "100"
  CHANGEGUARD_LLM_DAILY_GLOBAL_LIMIT: "200"
  CHANGEGUARD_LLM_MAX_CONCURRENCY: "4"
  CHANGEGUARD_LLM_HTTP_TIMEOUT: 15s
  CHANGEGUARD_LLM_MAX_RETRIES: "1"
  CHANGEGUARD_LLM_RETRY_BACKOFF: 200ms
  CHANGEGUARD_LLM_CIRCUIT_FAILURES: "3"
  CHANGEGUARD_LLM_CIRCUIT_COOLDOWN: 1m
  CHANGEGUARD_GITLAB_ORGANIZATION_ID: org_replace_me
  CHANGEGUARD_JENKINS_ORGANIZATION_ID: org_replace_me
  CHANGEGUARD_OPERATIONS_ORGANIZATION_ID: org_replace_me
