apiVersion: v1
kind: ConfigMap
metadata:
  name: dbguard-config
  namespace: dbguard
data:
  PORT: "8080"
  DBGUARD_STORE_MODE: postgres
  DBGUARD_SESSION_MODE: redis
  DBGUARD_WORKERS: "4"
  DBGUARD_DB_MAX_CONNS: "30"
  DBGUARD_DB_MIN_CONNS: "4"
  DBGUARD_AUTH_MODE: hybrid
  DBGUARD_AUTH_SESSION_TTL: 12h
  DBGUARD_AUTH_SECURE_COOKIE: "true"
  DBGUARD_OIDC_REQUIRE_VERIFIED_EMAIL: "true"
  DBGUARD_TRUST_PROXY_HEADERS: "true"
  DBGUARD_EXPERIMENT_MODE: postgres
  DBGUARD_LLM_LIMIT_MODE: redis
  DBGUARD_LLM_DAILY_ANALYSIS_LIMIT: "20"
  DBGUARD_LLM_DAILY_ORG_LIMIT: "100"
  DBGUARD_LLM_DAILY_GLOBAL_LIMIT: "200"
  DBGUARD_LLM_MAX_CONCURRENCY: "4"
  DBGUARD_LLM_HTTP_TIMEOUT: 15s
  DBGUARD_LLM_MAX_RETRIES: "1"
  DBGUARD_LLM_RETRY_BACKOFF: 200ms
  DBGUARD_LLM_CIRCUIT_FAILURES: "3"
  DBGUARD_LLM_CIRCUIT_COOLDOWN: 1m
  DBGUARD_GITLAB_ORGANIZATION_ID: org_replace_me
  DBGUARD_JENKINS_ORGANIZATION_ID: org_replace_me
  DBGUARD_OPERATIONS_ORGANIZATION_ID: org_replace_me
