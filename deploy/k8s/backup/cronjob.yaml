apiVersion: batch/v1
kind: CronJob
metadata:
  name: dbguard-postgres-backup
  namespace: dbguard
spec:
  schedule: "17 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 1800
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dbguard-postgres-backup
        spec:
          serviceAccountName: dbguard-postgres-backup
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: postgres:16.4-alpine
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  umask 077
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  target="/backup/dbguard-${stamp}.dump"
                  pg_dump --dbname="$DBGUARD_BACKUP_DSN" --format=custom --no-owner --no-acl --file="$target"
                  pg_restore --list "$target" >/dev/null
                  sha256sum "$target" >"${target}.sha256"
                  find /backup -type f -name 'dbguard-*' -mtime +14 -delete
              env:
                - name: DBGUARD_BACKUP_DSN
                  valueFrom:
                    secretKeyRef:
                      name: dbguard-backup-secrets
                      key: DBGUARD_BACKUP_DSN
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: dbguard-postgres-backup
            - name: tmp
              emptyDir:
                sizeLimit: 128Mi
