apiVersion: v1
kind: Secret
metadata:
  name: dbguard-secrets
  namespace: dbguard
type: Opaque
stringData:
  DBGUARD_PRIMARY_DSN: postgres://user:password@postgres.example:5432/dbguard?sslmode=require
  DBGUARD_REDIS_URL: rediss://user:password@redis.example:6379/0
  DBGUARD_SHADOW_DSN: postgres://user:password@shadow.example:5432/shadow?sslmode=require
  DBGUARD_LLM_BASE_URL: https://api.deepseek.com
  DBGUARD_LLM_API_KEY: replace-me
  DBGUARD_OIDC_ISSUER: https://id.example.com/realms/company
  DBGUARD_OIDC_CLIENT_ID: dbguard
  DBGUARD_OIDC_CLIENT_SECRET: replace-me
  DBGUARD_OIDC_REDIRECT_URL: https://dbguard.example.com/auth/callback
  DBGUARD_PUBLIC_URL: https://dbguard.example.com
  DBGUARD_PASSPORT_HMAC_SECRET: replace-with-at-least-32-random-bytes
  DBGUARD_GITLAB_SIGNING_TOKEN: replace-with-gitlab-signing-token
  DBGUARD_JENKINS_WEBHOOK_TOKEN: replace-with-an-independent-random-token
  DBGUARD_OPERATIONS_WEBHOOK_TOKEN: replace-with-an-independent-random-token
  DBGUARD_METRICS_TOKEN: replace-with-a-long-random-token
