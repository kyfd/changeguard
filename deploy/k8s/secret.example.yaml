apiVersion: v1
kind: Secret
metadata:
  name: changeguard-secrets
  namespace: dbguard
type: Opaque
stringData:
  CHANGEGUARD_PRIMARY_DSN: postgres://user:password@postgres.example:5432/dbguard?sslmode=require
  CHANGEGUARD_REDIS_URL: rediss://user:password@redis.example:6379/0
  CHANGEGUARD_SHADOW_DSN: postgres://user:password@shadow.example:5432/shadow?sslmode=require
  CHANGEGUARD_LLM_BASE_URL: https://api.deepseek.com
  CHANGEGUARD_LLM_API_KEY: replace-me
  CHANGEGUARD_OIDC_ISSUER: https://id.example.com/realms/company
  CHANGEGUARD_OIDC_CLIENT_ID: changeguard
  CHANGEGUARD_OIDC_CLIENT_SECRET: replace-me
  CHANGEGUARD_OIDC_REDIRECT_URL: https://changeguard.example.com/auth/callback
  CHANGEGUARD_PUBLIC_URL: https://changeguard.example.com
  CHANGEGUARD_PASSPORT_HMAC_SECRET: replace-with-at-least-32-random-bytes
  CHANGEGUARD_GITLAB_SIGNING_TOKEN: replace-with-gitlab-signing-token
  CHANGEGUARD_JENKINS_WEBHOOK_TOKEN: replace-with-an-independent-random-token
  CHANGEGUARD_OPERATIONS_WEBHOOK_TOKEN: replace-with-an-independent-random-token
  CHANGEGUARD_METRICS_TOKEN: replace-with-a-long-random-token
