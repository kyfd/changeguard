groups:
  - name: changeguard-core-governance
    interval: 30s
    rules:
      - alert: ChangeGuardCoreBuildProvenanceUnverified
        expr: dbguard_build_provenance_verified == 0
        for: 5m
        labels:
          severity: critical
          service: changeguard-core
        annotations:
          summary: ChangeGuard core build provenance is unverified
          description: Stop further core rollouts until version, commit, source digest, build time, and Go version are present and mutually verified.

      - alert: ChangeGuardOpenBlockingFindings
        expr: dbguard_governance_open_blocking_findings > 0
        for: 30m
        labels:
          severity: warning
          service: changeguard-core
        annotations:
          summary: ChangeGuard has unresolved blocking findings
          description: One or more blocking findings in the rolling governance window still require independent verification.

      - alert: ChangeGuardLinkedIncidentOpen
        expr: dbguard_governance_linked_incidents{state="open"} > 0
        for: 5m
        labels:
          severity: critical
          service: changeguard-core
        annotations:
          summary: A change-linked incident remains open
          description: Follow the external incident record and confirm mitigation, rollback, and final resolution evidence are linked to the change.

      - alert: ChangeGuardRollbackFailureObserved
        expr: dbguard_governance_rollback_outcomes{outcome="failed"} > 0
        for: 5m
        labels:
          severity: critical
          service: changeguard-core
        annotations:
          summary: A linked rollback execution failed
          description: Review the external rollback operation and activate the independently tested recovery path; the rolling metric remains non-zero until the event leaves the window.

      - alert: ChangeGuardPostReleaseRemediationRateHigh
        expr: dbguard_governance_post_release_samples >= 5 and dbguard_governance_post_release_remediation_rate_percent > 20
        for: 30m
        labels:
          severity: warning
          service: changeguard-core
        annotations:
          summary: Post-release remediation rate exceeds 20 percent
          description: At least five successful releases are observable and more than one fifth required a linked incident response or rollback execution.

      - alert: ChangeGuardBusinessSLIDegraded
        expr: dbguard_governance_business_sli_outcomes{outcome="degraded"} > 0
        for: 15m
        labels:
          severity: warning
          service: changeguard-core
        annotations:
          summary: A release-bracketed business SLI degraded
          description: Inspect the linked change and metric evidence; do not infer causality until the owning team confirms the operational context.

      - alert: ChangeGuardBusinessObjectiveAttainmentLow
        expr: dbguard_governance_business_objective_samples >= 5 and dbguard_governance_business_objective_attainment_percent < 90
        for: 30m
        labels:
          severity: warning
          service: changeguard-core
        annotations:
          summary: Business objective attainment is below 90 percent
          description: At least five explicit business objectives are observable and fewer than 90 percent were met in the rolling window.

      - alert: ChangeGuardBusinessOutcomeEvidenceMissing
        expr: sum(dbguard_governance_deployment_outcomes{outcome="success"}) > 0 and on() dbguard_governance_outcome_signal_observable{signal="business_sli"} == 0
        for: 24h
        labels:
          severity: warning
          service: changeguard-core
        annotations:
          summary: Successful releases lack business SLI evidence
          description: At least one successful terminal release is present, but no valid pre/post SLI comparison brackets a release in the rolling window.
