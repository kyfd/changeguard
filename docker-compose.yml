services:
  primary-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dbguard
      POSTGRES_PASSWORD: ${CHANGEGUARD_POSTGRES_PASSWORD:-dbguard}
      POSTGRES_DB: dbguard
    volumes:
      - primary-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbguard -d dbguard"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  shadow-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shadow_admin
      POSTGRES_PASSWORD: shadow_admin
      POSTGRES_DB: shadow
    volumes:
      - shadow-data:/var/lib/postgresql/data
      - ./deploy/shadow-init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadow_admin -d shadow"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  dbguard:
    build: .
    environment:
      PORT: "8080"
      CHANGEGUARD_STORE_MODE: postgres
      CHANGEGUARD_PRIMARY_DSN: postgres://dbguard:${CHANGEGUARD_POSTGRES_PASSWORD:-dbguard}@primary-postgres:5432/dbguard?sslmode=disable
      CHANGEGUARD_DB_MAX_CONNS: ${CHANGEGUARD_DB_MAX_CONNS:-20}
      CHANGEGUARD_DB_MIN_CONNS: ${CHANGEGUARD_DB_MIN_CONNS:-2}
      CHANGEGUARD_SESSION_MODE: redis
      CHANGEGUARD_REDIS_URL: redis://redis:6379/0
      CHANGEGUARD_WORKERS: "2"
      CHANGEGUARD_AUTH_MODE: ${CHANGEGUARD_AUTH_MODE:-local}
      CHANGEGUARD_ENABLE_DEMO_ACCOUNTS: ${CHANGEGUARD_ENABLE_DEMO_ACCOUNTS:-false}
      CHANGEGUARD_ENABLE_DEMO_DATA: ${CHANGEGUARD_ENABLE_DEMO_DATA:-false}
      CHANGEGUARD_PUBLIC_URL: ${CHANGEGUARD_PUBLIC_URL:-http://localhost:8080}
      CHANGEGUARD_AUTH_SESSION_TTL: ${CHANGEGUARD_AUTH_SESSION_TTL:-12h}
      CHANGEGUARD_AUTH_SECURE_COOKIE: ${CHANGEGUARD_AUTH_SECURE_COOKIE:-}
      CHANGEGUARD_TRUST_PROXY_HEADERS: "true"
      CHANGEGUARD_OIDC_ISSUER: ${CHANGEGUARD_OIDC_ISSUER:-}
      CHANGEGUARD_OIDC_CLIENT_ID: ${CHANGEGUARD_OIDC_CLIENT_ID:-}
      CHANGEGUARD_OIDC_CLIENT_SECRET: ${CHANGEGUARD_OIDC_CLIENT_SECRET:-}
      CHANGEGUARD_OIDC_REDIRECT_URL: ${CHANGEGUARD_OIDC_REDIRECT_URL:-http://localhost:8080/auth/callback}
      CHANGEGUARD_OIDC_SCOPES: ${CHANGEGUARD_OIDC_SCOPES:-openid,profile,email,groups}
      CHANGEGUARD_OIDC_ROLE_CLAIM: ${CHANGEGUARD_OIDC_ROLE_CLAIM:-groups}
      CHANGEGUARD_OIDC_OWNER_VALUES: ${CHANGEGUARD_OIDC_OWNER_VALUES:-}
      CHANGEGUARD_OIDC_REVIEWER_VALUES: ${CHANGEGUARD_OIDC_REVIEWER_VALUES:-}
      CHANGEGUARD_OIDC_ALLOWED_VALUES: ${CHANGEGUARD_OIDC_ALLOWED_VALUES:-}
      CHANGEGUARD_OIDC_ALLOWED_DOMAINS: ${CHANGEGUARD_OIDC_ALLOWED_DOMAINS:-}
      CHANGEGUARD_OIDC_TOKEN_AUTH_METHOD: ${CHANGEGUARD_OIDC_TOKEN_AUTH_METHOD:-client_secret_post}
      CHANGEGUARD_EXPERIMENT_MODE: ${CHANGEGUARD_EXPERIMENT_MODE:-postgres}
      CHANGEGUARD_SHADOW_DSN: postgres://dbguard_runner:dbguard_runner@shadow-postgres:5432/shadow?sslmode=disable
      CHANGEGUARD_PASSPORT_HMAC_SECRET: ${CHANGEGUARD_PASSPORT_HMAC_SECRET:?set a random secret of at least 32 bytes}
      CHANGEGUARD_PASSPORT_TTL: ${CHANGEGUARD_PASSPORT_TTL:-10m}
      CHANGEGUARD_LLM_BASE_URL: ${CHANGEGUARD_LLM_BASE_URL:-}
      CHANGEGUARD_LLM_API_KEY: ${CHANGEGUARD_LLM_API_KEY:-}
      CHANGEGUARD_LLM_MODEL: ${CHANGEGUARD_LLM_MODEL:-deepseek-chat}
      CHANGEGUARD_LLM_MAX_TOKENS: ${CHANGEGUARD_LLM_MAX_TOKENS:-700}
      CHANGEGUARD_LLM_DAILY_ANALYSIS_LIMIT: ${CHANGEGUARD_LLM_DAILY_ANALYSIS_LIMIT:-20}
      CHANGEGUARD_LLM_HTTP_TIMEOUT: ${CHANGEGUARD_LLM_HTTP_TIMEOUT:-15s}
      CHANGEGUARD_LLM_MAX_RETRIES: ${CHANGEGUARD_LLM_MAX_RETRIES:-1}
      CHANGEGUARD_LLM_RETRY_BACKOFF: ${CHANGEGUARD_LLM_RETRY_BACKOFF:-200ms}
      CHANGEGUARD_LLM_CIRCUIT_FAILURES: ${CHANGEGUARD_LLM_CIRCUIT_FAILURES:-3}
      CHANGEGUARD_LLM_CIRCUIT_COOLDOWN: ${CHANGEGUARD_LLM_CIRCUIT_COOLDOWN:-1m}
      CHANGEGUARD_GITLAB_SIGNING_TOKEN: ${CHANGEGUARD_GITLAB_SIGNING_TOKEN:-}
      CHANGEGUARD_GITLAB_WEBHOOK_SECRET: ${CHANGEGUARD_GITLAB_WEBHOOK_SECRET:-}
      CHANGEGUARD_GITLAB_ORGANIZATION_ID: ${CHANGEGUARD_GITLAB_ORGANIZATION_ID:-org_demo}
      CHANGEGUARD_JENKINS_WEBHOOK_TOKEN: ${CHANGEGUARD_JENKINS_WEBHOOK_TOKEN:-}
      CHANGEGUARD_JENKINS_ORGANIZATION_ID: ${CHANGEGUARD_JENKINS_ORGANIZATION_ID:-org_demo}
      CHANGEGUARD_OPERATIONS_WEBHOOK_TOKEN: ${CHANGEGUARD_OPERATIONS_WEBHOOK_TOKEN:-}
      CHANGEGUARD_OPERATIONS_ORGANIZATION_ID: ${CHANGEGUARD_OPERATIONS_ORGANIZATION_ID:-org_demo}
      CHANGEGUARD_METRICS_TOKEN: ${CHANGEGUARD_METRICS_TOKEN:-}
    depends_on:
      primary-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      shadow-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      dbguard:
        condition: service_healthy
    restart: unless-stopped

volumes:
  primary-data:
  redis-data:
  shadow-data:
