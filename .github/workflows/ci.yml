name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality-go:
    name: quality-go
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.x", "1.26.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify runtime artifacts are ignored and untracked
        shell: bash
        run: |
          set -euo pipefail
          for probe in .env tmp/.changeguard-probe bin/.changeguard-probe data/.changeguard-probe; do
            if ! git check-ignore --quiet --no-index "$probe"; then
              echo "::error file=.gitignore::Expected $probe to be ignored"
              exit 1
            fi
          done
          tracked=$(git ls-files -- .env 'tmp/**' 'bin/**' 'data/**')
          if [ -n "$tracked" ]; then
            echo "::error::Runtime artifacts must not be committed:"
            echo "$tracked"
            exit 1
          fi

      - name: Lock and verify the complete Go module graph
        run: |
          go mod download all
          go mod verify
          git diff --exit-code -- go.mod go.sum

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Run Linux race detector
        run: go test -race ./...

      - name: staticcheck
        if: matrix.go == '1.26.x'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          staticcheck ./...

      - name: Build container image
        if: matrix.go == '1.26.x'
        run: docker build -t changeguard:ci .

  quality-js:
    name: quality-js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check frontend JavaScript syntax
        run: |
          # 必须递归：变更准备工作台是独立文档，放在 internal/httpapi/web/agent/，
          # 单层 glob 会静默漏掉它。
          find internal/httpapi/web -type f \( -name '*.js' -o -name '*.mjs' \) -print0 |
            xargs -0 -r -n1 node --check

      - name: Run frontend unit tests
        run: npm test

  quality-agent:
    name: quality-agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-app/pyproject.toml

      - name: Install agent dependencies
        working-directory: agent-app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run agent tests
        working-directory: agent-app
        run: python -m pytest -q

      # 变更准备 Agent 是独立镜像，与治理服务镜像分开构建。
      # 构建上下文必须是仓库根目录：检索语料在 agent-app/ 之外，且由
      # agent-app/Dockerfile.dockerignore 负责裁剪上下文。
      - name: Build agent container image
        run: docker build -t changeguard-agent:ci -f agent-app/Dockerfile .

  quality:
    name: quality
    needs: [quality-go, quality-js, quality-agent]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require quality children
        run: |
          test "${{ needs.quality-go.result }}" = "success"
          test "${{ needs.quality-js.result }}" = "success"
          test "${{ needs.quality-agent.result }}" = "success"

  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dbguard
          POSTGRES_PASSWORD: dbguard-ci-password
          POSTGRES_DB: dbguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbguard -d dbguard_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DBGUARD_TEST_POSTGRES_DSN: postgres://dbguard:dbguard-ci-password@127.0.0.1:5432/dbguard_test?sslmode=disable
      DBGUARD_REDIS_TEST_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Require integration environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DBGUARD_TEST_POSTGRES_DSN:-}" || { echo "::error::DBGUARD_TEST_POSTGRES_DSN is required"; exit 1; }
          test -n "${DBGUARD_REDIS_TEST_URL:-}" || { echo "::error::DBGUARD_REDIS_TEST_URL is required"; exit 1; }
          pg_isready -d "$DBGUARD_TEST_POSTGRES_DSN"
          timeout 5 bash -c '</dev/tcp/127.0.0.1/6379'

      - name: Run PostgreSQL integration contract
        run: go test ./internal/store -run '^TestPostgresNormalizedMultiInstance$' -count=1 -v

      - name: Run Redis integration contract
        run: go test ./internal/auth -run '^TestRedisSessionRepositoryIntegration$' -count=1 -v

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Playwright test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run isolated UI regressions
        run: npm run test:ui

      - name: Start isolated E2E stack
        env:
          COMPOSE_PROJECT_NAME: changeguard-e2e
        run: docker compose -f compose.e2e.yml up --build --wait --wait-timeout 180

      - name: Run golden browser flow
        run: npm run test:e2e

      - name: Capture E2E service logs
        if: failure()
        env:
          COMPOSE_PROJECT_NAME: changeguard-e2e
        run: docker compose -f compose.e2e.yml logs --no-color

      - name: Stop isolated E2E stack
        if: always()
        env:
          COMPOSE_PROJECT_NAME: changeguard-e2e
        run: docker compose -f compose.e2e.yml down --volumes --remove-orphans

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Scan reachable Go vulnerabilities
        run: govulncheck ./...

      - name: Build scan target
        run: docker build -t changeguard:supply-chain .

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: changeguard:supply-chain
          format: cyclonedx
          output: changeguard.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: changeguard-cyclonedx-sbom
          path: changeguard.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Scan container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: changeguard:supply-chain
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  pr-description:
    name: pr-description
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require a non-empty pull request body
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ -z "${BODY// }" ]; then
            echo "::error::Pull request description is required."
            exit 1
          fi
