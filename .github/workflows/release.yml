name: Release

# 触发：推送标准语义版本标签（如 v3.0.1）
# 产出：changeguard-<version>.tar.gz 升级包和 CycloneDX SBOM，发布到 GitHub Releases
#
# 升级包结构（与 deploy/production/changeguard-core-install.sh 兼容）：
#   changeguard-<version>.tar.gz
#     └── changeguard-<version>/     # release_id 目录
#           ├── dbguard              # Linux amd64 二进制
#           ├── SHA256SUMS           # 全部文件校验
#           ├── release-manifest.json
#           ├── verification.json    # 验证证据
#           ├── source.bundle / source.tar.gz
#           └── ...（modules/module-verify/binary-buildinfo/bundle-verify/build.log）

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    name: Verify and build release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and verify annotated release tag
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git fetch origin main
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          test "$(git rev-list -n 1 "refs/tags/${GITHUB_REF_NAME}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          SEMVER="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || {
            echo "::error::Release tag must use vX.Y.Z format"
            exit 1
          }
          ASSET_VERSION="$(printf '%s' "$SEMVER" | tr '.' '-')"
          RELEASE_ID="changeguard-${ASSET_VERSION}"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "asset_version=$ASSET_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes from changelog
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md" <<'PY'
          import re
          import sys

          tag, output = sys.argv[1], sys.argv[2]
          version = tag.removeprefix("v")
          with open("CHANGELOG.md", encoding="utf-8") as handle:
              changelog = handle.read()
          match = re.search(
              rf"^## {re.escape(version)}(?:\s+-[^\n]*)?\n(?P<body>.*?)(?=^## |\Z)",
              changelog,
              flags=re.MULTILINE | re.DOTALL,
          )
          if not match:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          body = match.group("body").strip()
          for heading in ("### 升级", "### 已知限制"):
              if heading not in body:
                  raise SystemExit(f"CHANGELOG.md section {version} is missing {heading}")
          notes = f"## {tag}\n\n{body}\n"
          with open(output, "w", encoding="utf-8", newline="\n") as handle:
              handle.write(notes)
          PY

      - name: Verify formatting and frontend JavaScript syntax
        run: |
          test -z "$(gofmt -l .)"
          npm ci
          npm test
          for file in internal/httpapi/web/*.js internal/httpapi/web/*.mjs; do
            [ -e "$file" ] || continue
            node --check "$file"
          done

      - name: Run Go tests and vet
        run: |
          go test ./... -count=1
          go vet ./...

      - name: Run race detector
        run: go test -race ./... -count=1

      - name: Generate verification evidence
        id: evidence
        env:
          VERIFICATION_PATH: ${{ runner.temp }}/verification.json
        run: |
          python3 - "${{ steps.version.outputs.asset_version }}" "${{ steps.version.outputs.tag }}" "$VERIFICATION_PATH" <<'PY'
          import json, subprocess, sys
          version, tag, output = sys.argv[1], sys.argv[2], sys.argv[3]
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          source = subprocess.check_output(["bash", "deploy/production/source-tree-sha256.sh", "."], text=True).strip()
          evidence = {
              "schema": "changeguard-core-verification/v1",
              "status": "passed",
              "version": version,
              "tag": tag,
              "commit": commit,
              "source_sha256": source,
              "target": "linux/amd64",
              "built_at": subprocess.check_output(["git", "show", "-s", "--format=%cI", "HEAD"], text=True).strip(),
              "clean_worktree": True,
              "commands": [
                  {"command": "gofmt -l .", "status": "passed"},
                  {"command": "go test ./... -count=1", "status": "passed"},
                  {"command": "go vet ./...", "status": "passed"},
                  {"command": "go test -race ./... -count=1", "status": "passed"},
                  {"command": "node --check internal/httpapi/web/*.js internal/httpapi/web/*.mjs", "status": "passed"},
              ],
          }
          with open(output, "w", encoding="utf-8") as handle:
              json.dump(evidence, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          print(f"verification written for {commit} sha {source[:16]}")
          PY

      - name: Assemble offline release
        run: |
          go mod download all
          go list -m all >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq git 2>/dev/null || true
          CHANGEGUARD_VERSION="${{ steps.version.outputs.asset_version }}" \
          CHANGEGUARD_RELEASE_TAG="${{ steps.version.outputs.tag }}" \
          CHANGEGUARD_RELEASE_DIRECTORY="${{ runner.temp }}/release" \
          CHANGEGUARD_VERIFICATION_EVIDENCE="${{ runner.temp }}/verification.json" \
          CHANGEGUARD_GOMODCACHE="$(go env GOMODCACHE)" \
          bash deploy/production/build-core-git-release.sh

      - name: Package upgrade archive
        id: archive
        run: |
          RELEASE_ID="${{ steps.version.outputs.release_id }}"
          RELEASE_DIR="${{ runner.temp }}/release"
          PKG_DIR="${{ runner.temp }}/package/${RELEASE_ID}"
          mkdir -p "$PKG_DIR"
          cp "$RELEASE_DIR"/{dbguard,SHA256SUMS,release-manifest.json,verification.json,source.bundle,source.tar.gz,modules.txt,module-verify.txt,binary-buildinfo.txt,bundle-verify.txt,build.log} "$PKG_DIR/"
          tar -czf "${{ runner.temp }}/changeguard-${{ steps.version.outputs.asset_version }}.tar.gz" -C "${{ runner.temp }}/package" "$RELEASE_ID"
          sha256sum "${{ runner.temp }}/changeguard-${{ steps.version.outputs.asset_version }}.tar.gz" > "${{ runner.temp }}/changeguard-${{ steps.version.outputs.asset_version }}.tar.gz.sha256"
          echo "archive_sha256=$(awk '{print $1}' "${{ runner.temp }}/changeguard-${{ steps.version.outputs.asset_version }}.tar.gz.sha256")" >> "$GITHUB_OUTPUT"

      - name: Generate release CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: ${{ runner.temp }}/changeguard-${{ steps.version.outputs.asset_version }}.cdx.json

      - name: Verify release assets
        run: |
          set -euo pipefail
          test -s "${{ runner.temp }}/changeguard-${{ steps.version.outputs.asset_version }}.tar.gz"
          test -s "${{ runner.temp }}/changeguard-${{ steps.version.outputs.asset_version }}.tar.gz.sha256"
          test -s "${{ runner.temp }}/changeguard-${{ steps.version.outputs.asset_version }}.cdx.json"
          python3 - "${{ runner.temp }}/changeguard-${{ steps.version.outputs.asset_version }}.cdx.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              sbom = json.load(handle)
          if sbom.get("bomFormat") != "CycloneDX":
              raise SystemExit("release SBOM is not CycloneDX")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/changeguard-${{ steps.version.outputs.asset_version }}.tar.gz
            ${{ runner.temp }}/changeguard-${{ steps.version.outputs.asset_version }}.tar.gz.sha256
            ${{ runner.temp }}/changeguard-${{ steps.version.outputs.asset_version }}.cdx.json
